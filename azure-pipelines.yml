parameters:
- name: publishPreview
  displayName: Publish validated preview to the configured feed
  type: boolean
  default: false

variables:
  PublishPreview: ${{ parameters.publishPreview }}

stages:
- stage: build
  displayName: 'Build and Test Code'
  jobs:
  - template: tools/templates/ci.yml
- stage: images
  displayName: 'Build Images'
  dependsOn:
  - build
  jobs:
  - template: tools/templates/acrbuild.yml
- stage: preview
  displayName: Publish Preview Package
  dependsOn:
  - build
  - images
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/preview'), eq(variables['Build.Reason'], 'Manual'), eq(variables['PublishPreview'], 'true'))
  jobs:
  - template: tools/templates/preview.yml
