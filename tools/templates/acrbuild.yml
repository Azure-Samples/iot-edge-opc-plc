#
# Build images in acr
#
jobs:
- job: validateimages
  displayName: Validate Images Without Publishing
  condition: and(succeeded(), or(eq(variables['Build.Reason'], 'PullRequest'), and(ne(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.SourceBranch'], 'refs/heads/preview'), not(startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')))))
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - checkout: self
    fetchDepth: 0

  - task: Bash@3
    displayName: Build Release and Debug Images
    inputs:
      targetType: inline
      script: |
        set -euo pipefail
        docker build --file Dockerfile.release --tag opcplc-ci:release .
        docker build --file Dockerfile.debug --tag opcplc-ci:debug .
        test "$(docker run --rm --entrypoint id opcplc-ci:release -u)" = "1654"
        test "$(docker run --rm --entrypoint id opcplc-ci:debug -u)" = "1654"

- job: imagesprep
  displayName: Prepare Image Jobs
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), eq(variables['Build.SourceBranch'], 'refs/heads/preview')))
  pool:
    vmImage: 'ubuntu-latest'
  variables:
    skipComponentGovernanceDetection: true
  steps:
  - task: PowerShell@2
    name: acrmatrix
    displayName: Prepare Builds
    inputs:
      targetType: filePath
      filePath: ./tools/scripts/acr-matrix.ps1
      pwsh: true

- job: imagesall
  displayName: Build Images for
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), eq(variables['Build.SourceBranch'], 'refs/heads/preview')))
  pool:
    vmImage: 'ubuntu-latest'
  dependsOn: imagesprep
  strategy:
    matrix: $[ dependencies.imagesprep.outputs['acrmatrix.acrMatrix'] ]
  variables:
    skipComponentGovernanceDetection: true
  steps:
  - checkout: self
    fetchDepth: 0

  - task: PowerShell@2
    displayName: Versioning
    inputs:
      targetType: filePath
      filePath: ./tools/scripts/set-version.ps1
      pwsh: true

  - task: UseDotNet@2
    displayName: 'Install .NET Core SDK'
    inputs:
      packageType: sdk
      version: 10.0.x
      includePreviewVersions: false
      installationPath: $(Agent.ToolsDirectory)/dotnet

  - task: AzureCLI@1
    name: acrbuildr
    displayName: Build Release Images
    inputs:
      azureSubscription: azureiiot
      scriptLocation: inlineScript
      scriptType: pscore
      inlineScript: pwsh ./tools/scripts/acr-build.ps1 $(dockerFolder)

  - task: AzureCLI@1
    name: acrbuildd
    displayName: Build Debug Images
    inputs:
      azureSubscription: azureiiot
      scriptLocation: inlineScript
      scriptType: pscore
      inlineScript: pwsh ./tools/scripts/acr-build.ps1 $(dockerFolder) -debug
