jobs:
- job: approve
  displayName: Approve Preview Publication
  pool: server
  timeoutInMinutes: 1440
  steps:
  - task: ManualValidation@1
    timeoutInMinutes: 120
    inputs:
      notifyUsers: ''
      allowApproversToApproveTheirOwnRuns: false
      instructions: 'Approve publication of this validated 2.16.0 preview package to aio-brokers and versioned preview images. Stable publication remains unchanged.'
      onTimeout: reject

- template: acrbuild.yml
  parameters:
    previewApproved: true

- job: publish
  displayName: Publish Validated Preview
  dependsOn:
  - approve
  - imagesall
  pool:
    vmImage: ubuntu-latest
  steps:
  - checkout: self
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      version: 10.0.x
  - task: DownloadPipelineArtifact@2
    inputs:
      buildType: current
      artifactName: opcplc-release
      targetPath: '$(Pipeline.Workspace)/opcplc-release'
  - task: NuGetAuthenticate@1
    displayName: Authenticate Preview Feed
  - task: PowerShell@2
    displayName: Verify Channel and Publish Exact Artifact
    inputs:
      targetType: inline
      pwsh: true
      script: |
        $ErrorActionPreference = 'Stop'
        if ($env:BUILD_SOURCEBRANCH -ne 'refs/heads/preview' -or $env:BUILD_REASON -ne 'Manual') {
            throw 'Preview publication is permitted only for manually queued preview branch builds.'
        }
        $package = & ./tools/scripts/get-package.ps1 -PackageDirectory "$(Pipeline.Workspace)/opcplc-release" -RequirePreview
        dotnet nuget push $package.Path --source "$(OpcUaDebugNuGetFeed)" --api-key az
        if ($LASTEXITCODE -ne 0) {
            throw "Preview package publication failed with exit code $LASTEXITCODE."
        }
